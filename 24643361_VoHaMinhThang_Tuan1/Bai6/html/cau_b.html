<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Contact Us</h2>

    <form>
      <p><b>Your message:</b></p>
      <table>
        <tr>
          <td>To:</td>
          <td><input type="text" value="Example Cafe" readonly /></td>
        </tr>
        <tr>
          <td>Your email:</td>
          <td><input type="email" /></td>
        </tr>
        <tr>
          <td valign="top">Message:</td>
          <td><textarea rows="5" cols="30"></textarea></td>
        </tr>
        <tr>
          <td>Attach File:</td>
          <td><input type="file" /></td>
        </tr>
      </table>

      <br />
      <p><b>How you found us:</b></p>
      <table>
        <tr>
          <td>How did you hear of us:</td>
          <td>
            <select>
              <option>Google</option>
              <option>Facebook</option>
            </select>
          </td>
        </tr>
        <tr>
          <td valign="top">Newsletter:</td>
          <td>
            <input type="checkbox" checked />
            Ensure this box is checked if you would like to receive email
            updates
          </td>
        </tr>
      </table>

      <br />
      <input type="submit" value="Send message" />
    </form>
  </body>
</html>
