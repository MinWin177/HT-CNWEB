<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
      <style>
        .form-container {
            border: 4px solid #31487a;
            padding: 30px;
            max-width: 850px;
            margin: 0 auto;
            background-color: #fff;
        }

        .form-label {
            font-size: 0.95rem;
            color: #495057;
            margin-bottom: 0.2rem;
        }

        .btn-teal {
            background-color: #4db6ac;
            border-color: #4db6ac;
            color: white;
        }

        .btn-teal:hover {
            background-color: #26a69a;
            color: white;
        }
    </style>
    <script>
        function ktuser() {
            var user = document.getElementById("username").value;
            var User = /^[a-zA-Z0-9]+$/;
            if (User.test(user)) {
                document.getElementById("tbuser").innerHTML = "Hop le";
                return true;
            } else {
                document.getElementById("tbuser").innerHTML = "Username khong hop le";
                return false;
            }
        }
        function ktemail() {
            var email = document.getElementById("email").value;
            var Email = /^[A-Za-z]+[\d_]\@[A-Za-z]{5,7}\.[A-Za-z]{3}$/;
            if (Email.test(email)) {
                document.getElementById("tbemail").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tbemail").innerHTML = "email khong hop le";
                return false;
            }
        }

        function ktpass() {
            var pass = document.getElementById("pass").value;
            var Pass = /^.{6,}$/;
            if (Pass.test(pass)) {
                document.getElementById("tbpass").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tbpass").innerHTML = "mat khau toi thieu 6 ky tu";
                return false;
            }
        }

        function ktsdt() {
            var sdt = document.getElementById("sdt").value;
            var Sdt = /^0\d{9}$/;
            if (Sdt.test(sdt)) {
                document.getElementById("tbsdt").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tbsdt").innerHTML = "sdt phai co 10 so va bat dau bang 0";
                return false;
            }
        }

        function ktten() {
            var ten = document.getElementById("ten").value;
            var Ten = /^[A-Z]+(\s[A-Z]+)+$/;
            if (Ten.test(ten)) {
                document.getElementById("tbten").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tbten").innerHTML = "ten khong hop le";
                return false;
            }
        }
        function ktcompany() {
            var company = document.getElementById("companyName").value;
            var Company = /^[A-Z]+(\s[A-Z]+)+$/;
            if (Company.test(company)) {
                document.getElementById("tbcompany").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tbcompany").innerHTML = "ten cong ty khong hop le";
                return false;
            }
        }
        function ktcategory() {
            var category = document.getElementById("category").value;
            var Category = /^[a-zA-Z]+(\s[a-zA-Z]+)+$/;
            if (Category.test(category)) {
                document.getElementById("tbcategory").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tbcategory").innerHTML = "ten danh muc khong hop le";
                return false;
            }
        }
        function ktlocation() {
            var location = document.getElementById("location").value;
            var Location = /^[a-zA-Z0-9\s]+$/;
            if (Location.test(location)) {
                document.getElementById("tblocation").innerHTML = "hop le";
                return true;
            } else {
                document.getElementById("tblocation").innerHTML = "ten dia chi khong hop le";
                return false;
            }
        }
    </script>
</head>
<body>
    <div class="container mt-4">
        <div class="form-container">
            <form class="row g-4">

                <div class="col-md-6">
                    <label class="form-label">Tên người dùng</label>
                    <input type="text" class="form-control" placeholder="Chọn tên người dùng" id="username" onblur="ktuser()">
                    <span id="tbuser" class="text-danger"></span>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tên công ty</label>
                    <input type="text" class="form-control" placeholder="Tên công ty" id="companyName" onblur="ktcompany()">
                    <span id="tbcompany" class="text-danger"></span>
                </div>

                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" placeholder="Địa chỉ email" id="email" onblur="ktemail()">
                    <span id="tbemail" class="text-danger"></span>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Danh mục</label>
                    <input type="text" class="form-control" placeholder="Danh mục" id="category" onblur="ktcategory()">
                    <span id="tbcategory" class="text-danger"></span>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Tạo mật khẩu" id="pass" onblur="ktpass()">
                    <span id="tbpass" class="text-danger"></span>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" placeholder="Số điện thoại" id="sdt"   onblur="ktsdt()">
                    <span id="tbsdt" class="text-danger"></span>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" placeholder="Họ và tên" id="ten" onblur="ktten()">
                    <span id="tbten" class="text-danger"></span>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Vị trí của bạn</label>
                    <input type="text" class="form-control" placeholder="Your City" id="location" onblur="ktlocation()">
                    <span id="tblocation" class="text-danger"></span>
                </div>
                <div class="col-md-6">
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-teal px-4">Signup</button>
                        <span class="mx-2 text-dark" style="font-size: 0.9rem;">or</span>
                        <button type="button" class="btn btn-primary px-4">Sign Up with Facebook</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
