<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    
    <style>
        .form-wrapper {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="form-wrapper shadow-sm">
            <form class="row g-3 needs-validation" novalidate>
                <div class="col-md-4">
                    <label for="firstName" class="form-label">First name</label>
                    <input type="text" class="form-control" id="firstName" value="Mark" required>
                    <div class="valid-feedback">
                        Looks good!
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="lastName" class="form-label">Last name</label>
                    <input type="text" class="form-control" id="lastName" value="Otto" required>
                    <div class="valid-feedback">
                        Looks good!
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text" id="inputGroupPrepend">@</span>
                        <input type="text" class="form-control" id="username" aria-describedby="inputGroupPrepend"
                            required>
                        <div class="invalid-feedback">
                            Please choose a username.
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" required>
                    <div class="invalid-feedback">
                        Please provide a valid city.
                    </div>
                </div>
                <div class="col-md-3">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" required>
                    <div class="invalid-feedback">
                        Please provide a valid state.
                    </div>
                </div>

                <div class="col-md-3">
                    <label for="zip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="zip" required>
                    <div class="invalid-feedback">
                        Please provide a valid zip.
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                        <label class="form-check-label text-danger" for="invalidCheck">
                            Agree to terms and conditions
                        </label>
                        <div class="invalid-feedback">
                            You must agree before submitting.
                        </div>
                    </div>
                </div>

                <div class="col-12 mt-3">
                    <button class="btn btn-primary px-4" type="submit">Submit form</button>
                </div>

            </form>
        </div>
    </div>

    <script>
        // Mã JavaScript chuẩn của Bootstrap để xử lý form validation
        (() => {
            'use strict'
            // Tìm tất cả các form có class 'needs-validation'
            const forms = document.querySelectorAll('.needs-validation')
            // Lặp qua từng form và ngăn chặn hành vi gửi (submit) nếu dữ liệu chưa hợp lệ
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    // Kiểm tra xem form đã nhập đủ các trường 'required' chưa
                    if (!form.checkValidity()) {
                        event.preventDefault() // Ngăn form gửi đi
                        event.stopPropagation() // Ngăn sự kiện lan truyền
                    }
                    // Thêm class 'was-validated' vào form để Bootstrap hiển thị các màu viền xanh/đỏ
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
