<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>

    <style>
         /* Tùy chỉnh màu cam chủ đạo của rạp phim */
        .text-brand {
            color: #f26b38 !important;
        }

        .bg-brand {
            background-color: #f26b38 !important;
            color: white;
            border: none;
        }

        .bg-brand:hover {
            background-color: #d85524 !important;
            color: white
        }

        /* Tùy chỉnh Tabs trên Modal */
        .modal-tabs {
            border-bottom: none;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .modal-tabs .nav-link {
            border: none;
            color: #999;
            padding: 0.5rem 1rem;
            background: transparent;
        }

        /* Style cho Tab đang được chọn (Active) */
        .modal-tabs .nav-link.active {
            color: #f26b38;
            border-bottom: 3px solid #f26b38;
            font-weight: bold;
        }

        .form-control,
        .form-select {
            font-size: 0.9rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="cinemaCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../img/banner.png" class="d-block w-100" alt="Banner"
                    style="height: 100vh; object-fit: cover; filter: brightness(40%);">
                <div class="carousel-caption d-flex flex-column justify-content-center h-100 align-items-center">
                    <button type="button" class="btn bg-brand px-5 py-3 fw-bold fs-5" data-bs-toggle="modal"
                        data-bs-target="#authModal">
                        MỞ FORM ĐĂNG NHẬP / ĐĂNG KÝ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">

                <div class="d-flex justify-content-end">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body pt-0">
                    <ul class="nav nav-tabs modal-tabs mb-4" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login"
                                type="button" role="tab" aria-selected="true">ĐĂNG NHẬP</button>
                        </li>
                        <li class="nav-item d-flex align-items-center text-muted mx-2">/</li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register"
                                type="button" role="tab" aria-selected="false">ĐĂNG KÝ</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabContent">

                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form>
                                <p class="text-muted mb-4" style="font-size: 0.85rem;">
                                    Vui lòng đăng nhập trước khi mua vé để tích luỹ điểm, cơ hội nhận thêm nhiều ưu đãi
                                    từ chương trình thành viên Galaxy Cinema.
                                </p>

                                <div class="mb-3">
                                    <input type="email" class="form-control py-2" placeholder="Email">
                                </div>
                                <div class="mb-3">
                                    <input type="password" class="form-control py-2" placeholder="Mật khẩu">
                                </div>

                                <div class="mb-4 text-start">
                                    <a href="#" class="text-muted text-decoration-none" style="font-size: 0.85rem;">Quên
                                        mật khẩu?</a>
                                </div>

                                <button type="submit" class="btn bg-brand w-100 py-2 fw-bold">ĐĂNG NHẬP</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form class="row g-3">
                                <div class="col-12"><input type="text" class="form-control" placeholder="Họ tên"></div>
                                <div class="col-6"><input type="text" class="form-control" placeholder="Số điện thoại">
                                </div>
                                <div class="col-6">
                                    <select class="form-select text-muted">
                                        <option selected>Chọn giới tính</option>
                                        <option value="1">Nam</option>
                                        <option value="2">Nữ</option>
                                    </select>
                                </div>
                                <div class="col-12"><input type="email" class="form-control" placeholder="Email"></div>
                                <div class="col-6"><input type="password" class="form-control" placeholder="Mật khẩu">
                                </div>
                                <div class="col-6"><input type="password" class="form-control"
                                        placeholder="Xác nhận mật khẩu"></div>
                                <div class="col-6">
                                    <select class="form-select text-muted">
                                        <option selected>Chọn thành phố</option>
                                        <option value="1">Hồ Chí Minh</option>
                                        <option value="2">Hà Nội</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <select class="form-select text-muted">
                                        <option selected>Quận</option>
                                        <option value="1">Quận 1</option>
                                        <option value="2">Quận Gò Vấp</option>
                                    </select>
                                </div>
                                <div class="col-12"><input type="text" class="form-control" placeholder="Địa chỉ"></div>
                                <div class="col-12"><input type="text" class="form-control"
                                        placeholder="Chọn ngày (dd/mm/yyyy)"></div>
                                <div class="col-6 d-flex align-items-center justify-content-between pe-3">
                                    <span class="fw-bold fs-4"
                                        style="color: #dd00ff; letter-spacing: 5px; text-shadow: 1px 1px 2px #ccc;">352176</span>
                                    <i class="bi bi-arrow-clockwise fs-5 text-secondary" style="cursor: pointer;"></i>
                                </div>
                                <div class="col-6"><input type="text" class="form-control"
                                        placeholder="Nhập mã captcha"></div>
                                <div class="col-6 d-flex align-items-center">
                                    <i class="bi bi-app fs-5 text-secondary" style="cursor: pointer;"></i>
                                </div>       
                                <div class="col-12 mt-3 text-center">
                                    <p class="text-muted mb-0" style="font-size: 0.9rem;">
                                        Tôi đã đọc và đồng ý với <a href="#"
                                            class="text-brand text-decoration-none fw-bold">CHÍNH SÁCH</a> của chương
                                        trình.
                                    </p>
                                </div>
                                <div class="col-12 mt-3">
                                    <button type="submit" class="btn bg-brand w-100 py-2 fw-bold">ĐĂNG KÝ</button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
